<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Fixed Inputs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--primary:#0B5E64;--primary-light:#E7F6F6;--danger:#c0392b;--white:#fff;--radius:10px}
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:linear-gradient(180deg,var(--primary) 0%, var(--primary-light) 40%);font-family:'Inter',sans-serif;min-height:100vh}
  .header{background:var(--primary);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
  .header h1{margin:0;font-size:20px;font-weight:800}
  .header button{background:var(--white);color:var(--primary);border:none;padding:8px 16px;border-radius:var(--radius);font-weight:700;cursor:pointer}
  .container{max-width:900px;margin:20px auto;padding:0 16px 80px}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{flex:1;min-width:120px;padding:12px;background:var(--white);border:2px solid transparent;border-radius:var(--radius);font-weight:700;cursor:pointer;text-align:center}
  .tab.active{border-color:var(--primary);background:var(--primary-light)}
  .panel{display:none;background:var(--white);border-radius:var(--radius);padding:16px}
  .panel.active{display:block}
  .panel h2{margin-top:0;color:var(--primary);font-size:18px}
  .form-row{display:flex;gap:12px;margin-bottom:12px}
  .form-row>*{flex:1}
  label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
  input,textarea{width:100%;border:1px solid #cfd8dc;border-radius:6px;padding:8px;font-size:14px}
  input:focus,textarea:focus{outline:none;border-color:var(--primary)}
  textarea{min-height:80px;resize:vertical}
  .btn{border:none;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;margin-right:8px;margin-bottom:8px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-secondary{background:#e0e0e0;color:#333}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:#4CAF50;color:#fff}
  .list-container{max-height:400px;overflow-y:auto;margin:16px 0;border:1px solid #e0e0e0;border-radius:6px}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #f0f0f0}
  .list-item:last-child{border-bottom:none}
  .list-item-info{flex:1}
  .list-item-name{font-weight:700;font-size:14px}
  .list-item-detail{font-size:12px;color:#666;margin-top:2px}
  .list-item-actions{display:flex;gap:8px}
  .empty-state{text-align:center;padding:40px;color:#999}
  .status-msg{padding:12px;border-radius:6px;margin:12px 0;font-size:13px;font-weight:700}
  .status-msg.success{background:#E8F5E9;color:#2E7D32}
  .status-msg.error{background:#FFEBEE;color:#C62828}
  .status-msg.info{background:#E3F2FD;color:#1976D2}
  .config-textarea{font-family:'Roboto Mono',monospace;font-size:12px;min-height:200px}
  .bulk-textarea{font-size:13px;min-height:300px;font-family:'Inter',sans-serif;line-height:1.6}
  .hint{font-size:11px;color:#666;margin-top:4px}
  @media(max-width:600px){.form-row{flex-direction:column}.tabs{flex-direction:column}.tab{min-width:100%}}
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Manage Fixed Inputs</h1>
  <button onclick="window.close()">Close</button>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('items')">📦 Items</div>
    <div class="tab" onclick="switchTab('payments')">💳 Payments</div>
    <div class="tab" onclick="switchTab('company')">🏢 Company</div>
    <div class="tab" onclick="switchTab('appreciation')">💬 Appreciation</div>
    <div class="tab" onclick="switchTab('config')">🔧 Config</div>
  </div>

  <!-- ITEMS -->
  <div class="panel active" id="panel-items">
    <h2>Manage Items</h2>
    <div class="form-row">
      <div><label>Item Name</label><input type="text" id="itemName" maxlength="25" placeholder="Short name"></div>
      <div><label>Rate (₹)</label><input type="text" id="itemRate" maxlength="6" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="form-row">
      <div><label>MOQ</label><input type="text" id="itemMoq" maxlength="3" inputmode="numeric" placeholder="1"></div>
      <div><label>Free per MOQ</label><input type="text" id="itemFreePerMoq" maxlength="3" inputmode="numeric" placeholder="0"></div>
    </div>
    <div><button class="btn btn-primary" onclick="saveItem()">💾 Save Item</button><button class="btn btn-secondary" onclick="clearItemForm()">Clear</button></div>
    <div id="itemStatus"></div>
    <div class="list-container" id="itemList"></div>
  </div>

  <!-- PAYMENTS -->
  <div class="panel" id="panel-payments">
    <h2>Payment Methods</h2>
    <div class="form-row">
      <div><label>Name</label><input type="text" id="paymentName" maxlength="25" placeholder="e.g., GPay"></div>
      <div><label>UPI ID (blank for cash)</label><input type="text" id="paymentUpi" maxlength="50" placeholder="xxxx@upi"></div>
    </div>
    <div><button class="btn btn-primary" onclick="savePayment()">💾 Save Method</button><button class="btn btn-secondary" onclick="clearPaymentForm()">Clear</button></div>
    <div id="paymentStatus"></div>
    <div class="list-container" id="paymentList"></div>
  </div>

  <!-- COMPANY -->
  <div class="panel" id="panel-company">
    <h2>Company Details</h2>
    <div class="form-row">
      <div><label>Company Name</label><input type="text" id="companyName" maxlength="50" placeholder="SREE FOUNDATION"></div>
    </div>
    <div class="form-row">
      <div><label>Address</label><input type="text" id="companyAddress" maxlength="100" placeholder="Location"></div>
    </div>
    <div><button class="btn btn-primary" onclick="saveCompany()">💾 Save Company</button><button class="btn btn-secondary" onclick="loadCompany()">Refresh</button></div>
    <div id="companyStatus"></div>
  </div>

  <!-- APPRECIATION - WITH BULK PASTE -->
  <div class="panel" id="panel-appreciation">
    <h2>Appreciation Messages</h2>
    
    <div style="margin-bottom:16px;">
      <label>Bulk Paste (one message per line, emojis at end)</label>
      <textarea class="bulk-textarea" id="bulkAppreciation" placeholder="Thank you for trusting us your confidence means everything 🙏💖
Your continued support strengthens our commitment to serve you better 🤝🌟
We don't just see you as a customer you're a valued partner 🫂🔗"></textarea>
      <div class="hint">Paste all messages at once. Each line = one message. Emojis should be at the end of each line.</div>
      <div style="margin-top:8px;">
        <button class="btn btn-success" onclick="bulkSaveAppreciation()">📥 Bulk Import All</button>
        <button class="btn btn-primary" onclick="loadSampleAppreciation()">📋 Load 25 Samples</button>
      </div>
    </div>
    
    <hr style="border:none;border-top:1px solid #e0e0e0;margin:16px 0;">
    
    <div class="form-row">
      <div><label>Or Add Single Message</label><textarea id="appreciationText" maxlength="150" placeholder="Thank you message..."></textarea></div>
    </div>
    <div class="form-row">
      <div><label>Emoji 1</label><input type="text" id="emoji1" maxlength="2" placeholder="🙏"></div>
      <div><label>Emoji 2</label><input type="text" id="emoji2" maxlength="2" placeholder="💖"></div>
    </div>
    <div><button class="btn btn-primary" onclick="saveAppreciation()">💾 Save Message</button><button class="btn btn-secondary" onclick="clearAppreciationForm()">Clear</button></div>
    <div id="appreciationStatus"></div>
    <div class="list-container" id="appreciationList"></div>
  </div>

  <!-- CONFIG -->
  <div class="panel" id="panel-config">
    <h2>Firestore Config</h2>
    <p style="font-size:13px;color:#666">Current Firebase configuration:</p>
    <textarea class="config-textarea" id="firebaseConfigText"></textarea>
    <div style="margin-top:12px">
      <button class="btn btn-primary" onclick="saveFirebaseConfig()">💾 Save Config</button>
      <button class="btn btn-secondary" onclick="loadFirebaseConfig()">Load Current</button>
      <button class="btn btn-primary" onclick="testConnection()">🔗 Test</button>
    </div>
    <div id="configStatus"></div>
  </div>
</div>

<script>
// State
let items = [];
let payments = [];
let company = { name: '', address: '' };
let appreciation = [];
let db = null;

// Tab switching
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['items','payments','company','appreciation','config'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
}

// Utility
const $ = id => document.getElementById(id);
function showStatus(id,msg,type='info'){
  const el = $(id);
  if(!el) return;
  el.innerHTML = '<div class="status-msg '+type+'">'+msg+'</div>';
  setTimeout(()=>{el.innerHTML='';}, 5000);
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Firebase initialization
function initFirebase(){
  const config = JSON.parse(localStorage.getItem('sf_firebase_config') || '{"apiKey":"AIzaSyAtH3LTuNFUiPS7Kd5NF3YEg40pyXEI49A","authDomain":"sree-foundation-order-app.firebaseapp.com","projectId":"sree-foundation-order-app","storageBucket":"sree-foundation-order-app.firebasestorage.app","messagingSenderId":"289204055794","appId":"1:289204055794:web:6a85cb0e10d3a6c9aaaa6b"}');
  
  if(!window.firebaseInited){
    const script = document.createElement('script');
    script.type = 'module';
    script.textContent = `
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
      
      const app = initializeApp(${JSON.stringify(config)});
      window.db = getFirestore(app);
      window.setDoc = setDoc;
      window.getDoc = getDoc;
      window.doc = doc;
      window.firebaseReady = true;
      console.log('✅ Firebase initialized');
      loadData();
    `;
    document.head.appendChild(script);
    window.firebaseInited = true;
  }
}

// Load data
async function loadData(){
  items = JSON.parse(localStorage.getItem('sf_items_v1') || '[]');
  payments = JSON.parse(localStorage.getItem('sf_receivers_v1') || '[]');
  company = JSON.parse(localStorage.getItem('sf_company_v1') || '{"name":"","address":""}');
  appreciation = JSON.parse(localStorage.getItem('sf_appreciation_v1') || '[]');
  
  if(window.firebaseReady && window.db){
    try{
      const snap = await window.getDoc(window.doc(window.db, 'config', 'main'));
      if(snap.exists()){
        const data = snap.data();
        items = data.items || items;
        payments = data.receivers || payments;
        company = data.company || company;
        appreciation = data.appreciation || appreciation;
        console.log('📥 Loaded from Firestore');
      }
    }catch(e){
      console.log('⚠️ Firestore load failed, using localStorage');
    }
  }
  
  renderAll();
}

// Save to Firestore
async function saveToFirestore(){
  if(!window.firebaseReady || !window.db){
    console.warn('⚠️ Firebase not ready');
    return false;
  }
  
  try{
    const data = { items, receivers: payments, company, appreciation, updatedAt: new Date().toISOString() };
    await window.setDoc(window.doc(window.db, 'config', 'main'), data);
    console.log('💾 Saved to Firestore');
    return true;
  }catch(e){
    console.error('❌ Firestore save failed:', e);
    return false;
  }
}

// Render
function renderAll(){
  renderItems();
  renderPayments();
  renderCompany();
  renderAppreciation();
}

function renderItems(){
  const list = $('itemList');
  if(!list) return;
  if(items.length===0){ list.innerHTML='<div class="empty-state">No items yet</div>'; return; }
  list.innerHTML = items.map((item,i)=>`
    <div class="list-item">
      <div class="list-item-info">
        <div class="list-item-name">${escapeHtml(item.name)}</div>
        <div class="list-item-detail">₹${item.rate} | MOQ:${item.moq||1} | Free:${item.freePerMoq||0}</div>
      </div>
      <div class="list-item-actions"><button class="btn btn-secondary" onclick="editItem(${i})">✏️</button><button class="btn btn-danger" onclick="deleteItem(${i})">🗑️</button></div>
    </div>
  `).join('');
}

function renderPayments(){
  const list = $('paymentList');
  if(!list) return;
  if(payments.length===0){ list.innerHTML='<div class="empty-state">No payment methods yet</div>'; return; }
  list.innerHTML = payments.map((p,i)=>`
    <div class="list-item">
      <div class="list-item-info">
        <div class="list-item-name">${escapeHtml(p.name)}</div>
        <div class="list-item-detail">${p.upi||'Cash'}</div>
      </div>
      <div class="list-item-actions"><button class="btn btn-secondary" onclick="editPayment(${i})">✏️</button><button class="btn btn-danger" onclick="deletePayment(${i})">🗑️</button></div>
    </div>
  `).join('');
}

function renderCompany(){
  $('companyName').value = company.name || '';
  $('companyAddress').value = company.address || '';
}

function renderAppreciation(){
  const list = $('appreciationList');
  if(!list) return;
  if(appreciation.length===0){ list.innerHTML='<div class="empty-state">No messages yet</div>'; return; }
  list.innerHTML = appreciation.map((a,i)=>`
    <div class="list-item">
      <div class="list-item-info">
        <div class="list-item-name">${escapeHtml(a.text)}</div>
        <div class="list-item-detail">${a.emojis?a.emojis.join(' '):''}</div>
      </div>
      <div class="list-item-actions"><button class="btn btn-danger" onclick="deleteAppreciation(${i})">🗑️</button></div>
    </div>
  `).join('');
}

// Items
function saveItem(){
  const name = $('itemName').value.trim();
  const rate = parseFloat($('itemRate').value) || 0;
  const moq = parseInt($('itemMoq').value) || 1;
  const freePerMoq = parseInt($('itemFreePerMoq').value) || 0;
  
  if(!name){ showStatus('itemStatus','⚠️ Name required','error'); return; }
  
  items.push({ name, rate, moq, freePerMoq });
  localStorage.setItem('sf_items_v1', JSON.stringify(items));
  saveToFirestore();
  clearItemForm();
  renderItems();
  showStatus('itemStatus','✅ Item saved','success');
}

function editItem(i){
  const item = items[i];
  $('itemName').value = item.name;
  $('itemRate').value = item.rate;
  $('itemMoq').value = item.moq;
  $('itemFreePerMoq').value = item.freePerMoq;
  items.splice(i,1);
  renderItems();
}

function deleteItem(i){
  if(confirm('Delete this item?')){
    items.splice(i,1);
    localStorage.setItem('sf_items_v1', JSON.stringify(items));
    saveToFirestore();
    renderItems();
    showStatus('itemStatus','🗑️ Deleted','success');
  }
}

function clearItemForm(){
  $('itemName').value=''; $('itemRate').value=''; $('itemMoq').value=''; $('itemFreePerMoq').value='';
}

// Payments
function savePayment(){
  const name = $('paymentName').value.trim();
  const upi = $('paymentUpi').value.trim();
  
  if(!name){ showStatus('paymentStatus','⚠️ Name required','error'); return; }
  
  payments.push({ name, upi });
  localStorage.setItem('sf_receivers_v1', JSON.stringify(payments));
  saveToFirestore();
  clearPaymentForm();
  renderPayments();
  showStatus('paymentStatus','✅ Payment method saved','success');
}

function editPayment(i){
  const p = payments[i];
  $('paymentName').value = p.name;
  $('paymentUpi').value = p.upi;
  payments.splice(i,1);
  renderPayments();
}

function deletePayment(i){
  if(confirm('Delete this method?')){
    payments.splice(i,1);
    localStorage.setItem('sf_receivers_v1', JSON.stringify(payments));
    saveToFirestore();
    renderPayments();
    showStatus('paymentStatus','🗑️ Deleted','success');
  }
}

function clearPaymentForm(){
  $('paymentName').value=''; $('paymentUpi').value='';
}

// Company
function saveCompany(){
  company.name = $('companyName').value.trim();
  company.address = $('companyAddress').value.trim();
  
  if(!company.name){ showStatus('companyStatus','⚠️ Name required','error'); return; }
  
  localStorage.setItem('sf_company_v1', JSON.stringify(company));
  saveToFirestore();
  showStatus('companyStatus','✅ Company saved','success');
}

function loadCompany(){
  renderCompany();
  showStatus('companyStatus','🔄 Refreshed','info');
}

// Appreciation - SINGLE
function saveAppreciation(){
  const text = $('appreciationText').value.trim();
  const e1 = $('emoji1').value.trim();
  const e2 = $('emoji2').value.trim();
  
  if(!text){ showStatus('appreciationStatus','⚠️ Message required','error'); return; }
  
  const emojis = [e1,e2].filter(x=>x);
  appreciation.push({ text, emojis });
  localStorage.setItem('sf_appreciation_v1', JSON.stringify(appreciation));
  saveToFirestore();
  clearAppreciationForm();
  renderAppreciation();
  showStatus('appreciationStatus','✅ Message saved','success');
}

function deleteAppreciation(i){
  appreciation.splice(i,1);
  localStorage.setItem('sf_appreciation_v1', JSON.stringify(appreciation));
  saveToFirestore();
  renderAppreciation();
  showStatus('appreciationStatus','🗑️ Deleted','success');
}

function clearAppreciationForm(){
  $('appreciationText').value=''; $('emoji1').value=''; $('emoji2').value='';
}

// Appreciation - BULK PASTE
function bulkSaveAppreciation(){
  const bulkText = $('bulkAppreciation').value.trim();
  
  if(!bulkText){
    showStatus('appreciationStatus','⚠️ Paste messages first','error');
    return;
  }
  
  const lines = bulkText.split('\n').filter(line => line.trim());
  let added = 0;
  
  lines.forEach(line => {
    const text = line.trim();
    // Extract emojis from end (last 1-4 characters)
    const emojiMatch = text.match(/([\u{1F300}-\u{1F9FF}]+)$/u);
    let emojis = [];
    let messageText = text;
    
    if(emojiMatch){
      const emojiStr = emojiMatch[1];
      emojis = Array.from(emojiStr);
      messageText = text.slice(0, -emojiStr.length).trim();
    }
    
    if(messageText.length > 0){
      appreciation.push({ text: messageText, emojis });
      added++;
    }
  });
  
  localStorage.setItem('sf_appreciation_v1', JSON.stringify(appreciation));
  saveToFirestore();
  renderAppreciation();
  $('bulkAppreciation').value = '';
  showStatus('appreciationStatus',`✅ Imported ${added} messages`,'success');
}

// Config
function loadFirebaseConfig(){
  const cfg = localStorage.getItem('sf_firebase_config') || '{"apiKey":"AIzaSyAtH3LTuNFUiPS7Kd5NF3YEg40pyXEI49A","authDomain":"sree-foundation-order-app.firebaseapp.com","projectId":"sree-foundation-order-app","storageBucket":"sree-foundation-order-app.firebasestorage.app","messagingSenderId":"289204055794","appId":"1:289204055794:web:6a85cb0e10d3a6c9aaaa6b"}';
  $('firebaseConfigText').value = JSON.stringify(JSON.parse(cfg), null, 2);
}

function saveFirebaseConfig(){
  try{
    const cfg = JSON.parse($('firebaseConfigText').value);
    if(!cfg.apiKey || !cfg.projectId){ showStatus('configStatus','⚠️ Invalid config','error'); return; }
    localStorage.setItem('sf_firebase_config', JSON.stringify(cfg));
    showStatus('configStatus','✅ Config saved - reload page to apply','success');
    setTimeout(()=>location.reload(), 1500);
  }catch(e){
    showStatus('configStatus','⚠️ Invalid JSON: '+e.message,'error');
  }
}

async function testConnection(){
  showStatus('configStatus','🔗 Testing...','info');
  if(!window.firebaseReady){ showStatus('configStatus','⚠️ Firebase not initialized','error'); return; }
  try{
    await window.getDoc(window.doc(window.db, 'config', 'main'));
    showStatus('configStatus','✅ Connection successful','success');
  }catch(e){
    showStatus('configStatus','⚠️ Failed: '+e.message,'error');
  }
}

// Initialize
initFirebase();
loadFirebaseConfig();
</script>
